name: Build VidSet APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Create the Android project (wraps https://vidset.netlify.app)
        run: |
          mkdir vidset-app && cd vidset-app
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir www
          echo '<!doctype html><title>VidSet</title><p>Loading VidSet...</p>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.vidset.app",
            "appName": "VidSet",
            "webDir": "www",
            "server": {
              "url": "https://vidset.netlify.app",
              "cleartext": false
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build the APK
        working-directory: vidset-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp vidset-app/android/app/build/outputs/apk/debug/app-debug.apk VidSet.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VidSet-apk
          path: VidSet.apk

      - name: Publish a release with the APK (easy download on your phone)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" VidSet.apk \
            --title "VidSet APK #${{ github.run_number }}" \
            --notes "Debug APK of VidSet. Download VidSet.apk and install it on Android." \
            --repo "${{ github.repository }}"
